<VirtualHost *:80>
    ServerName local.pixelfed.dev

    DocumentRoot /var/www/html/pixelfed/public

    <Directory /var/www/html/pixelfed/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/pixelfed-error.log
    CustomLog ${APACHE_LOG_DIR}/pixelfed-access.log combined

    # Certbot will add the redirect to HTTPS automatically
</VirtualHost>

